version: '3.8'

services:
  # --- BANCO RELACIONAL (Regras de Negócio) ---
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rules_db
    ports:
      - "5432:5432"
    volumes:
      - ./assets/init.sql:/docker-entrypoint-initdb.d/init.sql

  # --- BANCO NoSQL (Alta Volumetria de Transações) ---
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"

  # Container utilitário para criar as tabelas no DynamoDB no boot
  dynamodb-init:
    image: amazon/aws-cli:latest
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: mock_key
      AWS_SECRET_ACCESS_KEY: mock_secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: [ "sh", "-c" ]
    command: >
      sleep 2;
      aws dynamodb create-table --endpoint-url http://dynamodb-local:8000 --table-name liquidations --attribute-definitions AttributeName=cpf,AttributeType=S AttributeName=sk_date_amount,AttributeType=S --key-schema AttributeName=cpf,KeyType=HASH AttributeName=sk_date_amount,KeyType=RANGE --billing-mode PAY_PER_REQUEST;
      aws dynamodb create-table --endpoint-url http://dynamodb-local:8000 --table-name refunds --attribute-definitions AttributeName=cpf,AttributeType=S AttributeName=refund_id,AttributeType=S --key-schema AttributeName=cpf,KeyType=HASH AttributeName=refund_id,KeyType=RANGE --billing-mode PAY_PER_REQUEST;

  # --- SERVIDOR MCP ---
  mcp-app:
    build: .
    environment:
      - DB_HOST=db
      - DYNAMO_ENDPOINT=http://dynamodb-local:8000
    depends_on:
      - db
      - dynamodb-local
    command: ["./mcp-server"]